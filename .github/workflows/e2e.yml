name: E2E (manual)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL contra la que correr los smokes"
        required: false
        default: "https://www.mangui.com.ar"

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
        run: npm run e2e -- e2e/smoke.spec.ts

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
